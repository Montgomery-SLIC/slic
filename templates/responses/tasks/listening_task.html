{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Listening" %}{% endblock %}

{% block content %}
<div class="py-4 text-center">
  <div class="data" data-listens="{{ specific.listens|default:1 }}" style="display:none;"></div>
  <audio id="audio-el" src="{{ audio_url }}" preload="auto"></audio>

  <div class="mx-auto text-center audio-player">

    <div class="progress mb-1 audio-progress">
      <div id="progress-bar" class="progress-bar audio-progress-bar" role="progressbar"
           aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
    </div>

    <div class="d-flex justify-content-between text-muted small mb-4">
      <span id="current-time">0:00</span>
      <span id="duration">--:--</span>
    </div>

    <p class="text-muted small mb-3" id="listens-counter"></p>

    <button id="play-btn" type="button" class="btn btn-outline-secondary">
      {% trans "Play" %}
    </button>

    <div class="mt-5">
      <a id="next-btn" href="{{ next_url }}" class="btn btn-primary" style="display:none;">
        {% trans "Next" %}
      </a>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
  var audio    = document.getElementById('audio-el');
  var bar      = document.getElementById('progress-bar');
  var timeEl   = document.getElementById('current-time');
  var durEl    = document.getElementById('duration');
  var counter  = document.getElementById('listens-counter');
  var playBtn  = document.getElementById('play-btn');
  var nextBtn  = document.getElementById('next-btn');
  var listens  = parseInt(document.querySelector('.data').dataset.listens || '1');

  function fmt(s) {
    if (!isFinite(s)) return '--:--';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function updateCounter() {
    counter.textContent = '{% trans "Listens remaining" %}: ' + listens;
    if (listens <= 0) { playBtn.disabled = true; }
  }

  updateCounter();

  audio.addEventListener('loadedmetadata', function () {
    durEl.textContent = fmt(audio.duration);
  });

  audio.addEventListener('timeupdate', function () {
    var pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    bar.style.width = pct + '%';
    bar.setAttribute('aria-valuenow', Math.round(pct));
    timeEl.textContent = fmt(audio.currentTime);
  });

  audio.addEventListener('ended', function () {
    if (listens <= 0) { nextBtn.style.display = 'inline-block'; }
    if (listens > 0) { playBtn.disabled = false; }
  });

  playBtn.addEventListener('click', function () {
    if (listens > 0) {
      audio.currentTime = 0;
      audio.play();
      playBtn.disabled = true;
      listens -= 1;
      updateCounter();
    }
  });
}());
</script>
{% endblock %}
